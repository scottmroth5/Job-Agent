# The cloud server: the app's container behind Caddy, which gets and renews the HTTPS certificate on its own.
# Lives on the server at /opt/job-agent/compose.yml with deploy.sh, Caddyfile, and .env beside it.
# deploy.sh sets IMAGE_TAG; by hand: IMAGE_TAG=<tag> docker compose up -d
#
# Only Caddy is reachable from outside (ports 80 and 443). The app listens on the private Docker network.
# demo is the public, read-only showcase at DEMO_SITE_ADDRESS: the same image on made-up sample data, with none of
# the app's secrets, a fresh database on every start, and its own small memory and CPU limits.

name: job-agent

services:
  app:
    image: ${IMAGE:-ghcr.io/scottmroth5/job-agent}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Every setting and secret, from the server's own .env (never in GitHub or the image).
    env_file: .env
    environment:
      # Fixed for the container, whatever .env says: data on the mounted disk, reachable by Caddy, and Caddy trusted
      # as the proxy. TRUST_PROXY names private addresses, never a hop count: a count makes Fastify report Caddy's
      # address for every visitor, so the per-address rate limits would be shared by everyone.
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "5178"
      TRUST_PROXY: loopback,linklocal,uniquelocal
      # US-only access (server/geo.ts); the health check always passes.
      GEO_ALLOW: US
      # On a PostgreSQL server (server.conf DB_ENGINE=postgres) deploy.sh sets these: the app never opens a SQLite file
      # and never migrates (scripts/migrate.js does, at deploy). Elsewhere (the Lightsail server) they stay off.
      REQUIRE_POSTGRES: ${JA_REQUIRE_POSTGRES:-0}
      DATABASE_MIGRATIONS: ${JA_DATABASE_MIGRATIONS:-}
    volumes:
      # The database, config, Google tokens, attachments, and logs. Survives every deploy.
      - ./data:/data
    expose:
      - "5178"
    # Reaps Chromium's child processes; a bigger shared memory area keeps Chromium from crashing on large pages.
    init: true
    shm_size: 512mb
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  demo:
    image: ${IMAGE:-ghcr.io/scottmroth5/job-agent}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No env_file: the demo never sees the app's API keys, Google tokens, or session secret.
    environment:
      AUTH_MODE: demo
      PUBLIC_URL: https://${DEMO_SITE_ADDRESS:?set DEMO_SITE_ADDRESS in .env}
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "5178"
      TRUST_PROXY: loopback,linklocal,uniquelocal
      # Open from any country: the demo holds only made-up data and changes nothing, so reviewers abroad can use it.
      # The app stays US-only (its GEO_ALLOW above).
      GEO_ALLOW: ""
      TZ: ${TZ:-UTC}
      # The banner's "Request access" link: the real app, where someone signs in with Google and asks.
      REQUEST_ACCESS_URL: https://${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      # Where to ask for help (shown on the banner); the same SUPPORT_EMAIL as the app's .env, or nothing.
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # Optional usage counts for the demo only (server/demo-analytics.ts): a PostHog project key (phc_..., meant for
      # browser code) and its host. Left empty, the demo sends nothing. The app never reads these.
      DEMO_POSTHOG_KEY: ${DEMO_POSTHOG_KEY:-}
      DEMO_POSTHOG_HOST: ${DEMO_POSTHOG_HOST:-}
      # The demo's own PostgreSQL (demo-db below), like production after Phase 5. No password: only the demo can
      # reach it, on the demo-db network, and it holds sample data only.
      DATABASE_URL: postgres://demo@demo-db:5432/demo
      # The production image requires certificate checking for a database on another machine (db/postgres/store.ts
      # checkTls); demo-db is on a private Docker network, so it is waived here, and only here.
      DATABASE_TLS: "off"
    # Builds the sample database, then serves it. A restart resets the demo.
    command: ["sh", "-c", "node scripts/demo-seed.js --force && exec node server/index.js"]
    # restart: a restart of demo-db through Compose restarts the demo too, which rebuilds the sample data. A restart
    # Compose does not see (a crash) is caught by the demo itself, which exits when its data is gone (server/main.ts).
    depends_on:
      demo-db:
        condition: service_healthy
        restart: true
    networks:
      - default
      - demo-db
    # Nothing on disk survives or is shared: the code is read-only and the sample data lives in memory.
    read_only: true
    tmpfs:
      - /data:size=64m,uid=1000,gid=1000,mode=0700
      - /tmp:size=16m
    expose:
      - "5178"
    init: true
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

  # The backup container (v3 Phase 5, PostgreSQL servers only: the postgres profile, which deploy.sh turns on from
  # server.conf): the nightly encrypted backup and monthly restore test (scripts/backup-service.js), and the deploy's
  # checked dump and migration. The same image plus PostgreSQL 18's programs. It alone holds backup.env, the owner and
  # backup logins (MIGRATE_DATABASE_URL, BACKUP_DATABASE_URL), so the app never can change the schema or read it all.
  backup:
    image: ${IMAGE:-ghcr.io/scottmroth5/job-agent}:${IMAGE_TAG:-latest}-backup
    profiles: [postgres]
    restart: unless-stopped
    env_file:
      - .env
      # Optional to compose, so a server without it still reads this file; the service refuses to run without the
      # addresses it needs.
      - path: backup.env
        required: false
    environment:
      DATA_DIR: /data
      REQUIRE_POSTGRES: "1"
      DATABASE_MIGRATIONS: deploy
    volumes:
      # The Google sign-in (Drive), the settings and attachments it backs up, and data/backups for pre-migration dumps.
      - ./data:/data
    read_only: true
    tmpfs:
      # Scratch clusters (each backup and restore test restores the dump here) and the plaintext dump.
      - /tmp:size=384m,uid=1000,gid=1000,mode=0700
    init: true
    stop_grace_period: 30s
    mem_limit: 768m
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"

  # The demo's database (v3 Phase 4): PostgreSQL holding the sample data only, in memory (tmpfs), so a restart empties
  # it and the demo rebuilds it. Reachable only from the demo, on the internal demo-db network (no route out, no
  # published port), which is why it signs in without a password (trust). The app never joins that network.
  demo-db:
    image: postgres:18-alpine
    restart: unless-stopped
    user: "70:70" # the image's postgres user, so no root step and no capabilities are needed
    environment:
      POSTGRES_USER: demo
      POSTGRES_DB: demo
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/data/pgdata
    # Small and fast: the data is thrown away on every restart, so nothing needs to survive a crash.
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=20", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    read_only: true
    tmpfs:
      - /var/lib/postgresql/data:size=96m,uid=70,gid=70,mode=0700
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=0775
      - /tmp:size=8m
    shm_size: 32mb
    networks:
      - demo-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 160m
    cpus: 0.25
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: 1m
        max-file: "2"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
      - demo
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # The public address, e.g. jobs.example.com. Set in the server's .env.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      DEMO_SITE_ADDRESS: ${DEMO_SITE_ADDRESS:?set DEMO_SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  # Caddy's certificates and keys. Kept so a restart never asks Let's Encrypt for a new certificate.
  caddy_data:
  caddy_config:

networks:
  # Only the demo and its database. internal: no route to the internet and none from it.
  demo-db:
    internal: true
