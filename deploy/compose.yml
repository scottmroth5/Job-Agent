# The cloud server: the app's container behind Caddy, which gets and renews the HTTPS certificate on its own.
# Lives on the server at /opt/job-agent/compose.yml with deploy.sh, Caddyfile, and .env beside it.
# deploy.sh sets IMAGE_TAG; by hand: IMAGE_TAG=<tag> docker compose up -d
#
# Only Caddy is reachable from outside (ports 80 and 443). The app listens on the private Docker network.
# demo is the public, read-only showcase at DEMO_SITE_ADDRESS: the same image on made-up sample data, with none of
# the app's secrets, a fresh database on every start, and its own small memory and CPU limits.

name: job-agent

services:
  app:
    image: ${IMAGE:-ghcr.io/scottmroth5/job-agent}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Every setting and secret, from the server's own .env (never in GitHub or the image).
    env_file: .env
    environment:
      # Fixed for the container, whatever .env says: data on the mounted disk, reachable by Caddy, and Caddy trusted
      # as the proxy. TRUST_PROXY names private addresses, never a hop count: a count makes Fastify report Caddy's
      # address for every visitor, so the per-address rate limits would be shared by everyone.
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "5178"
      TRUST_PROXY: loopback,linklocal,uniquelocal
      # US-only access (server/geo.js); the health check always passes.
      GEO_ALLOW: US
    volumes:
      # The database, config, Google tokens, attachments, and logs. Survives every deploy.
      - ./data:/data
    expose:
      - "5178"
    # Reaps Chromium's child processes; a bigger shared memory area keeps Chromium from crashing on large pages.
    init: true
    shm_size: 512mb
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  demo:
    image: ${IMAGE:-ghcr.io/scottmroth5/job-agent}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No env_file: the demo never sees the app's API keys, Google tokens, or session secret.
    environment:
      AUTH_MODE: demo
      PUBLIC_URL: https://${DEMO_SITE_ADDRESS:?set DEMO_SITE_ADDRESS in .env}
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "5178"
      TRUST_PROXY: loopback,linklocal,uniquelocal
      # US-only access (server/geo.js); the health check always passes.
      GEO_ALLOW: US
      TZ: ${TZ:-UTC}
      # The banner's "Request access" link: the real app, where someone signs in with Google and asks.
      REQUEST_ACCESS_URL: https://${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      # Where to ask for help (shown on the banner); the same SUPPORT_EMAIL as the app's .env, or nothing.
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
    # Builds the sample database, then serves it. A restart resets the demo.
    command: ["sh", "-c", "node scripts/demo-seed.js --force && exec node server/index.js"]
    # Nothing on disk survives or is shared: the code is read-only and the sample data lives in memory.
    read_only: true
    tmpfs:
      - /data:size=64m,uid=1000,gid=1000,mode=0700
      - /tmp:size=16m
    expose:
      - "5178"
    init: true
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
      - demo
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # The public address, e.g. jobs.example.com. Set in the server's .env.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      DEMO_SITE_ADDRESS: ${DEMO_SITE_ADDRESS:?set DEMO_SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  # Caddy's certificates and keys. Kept so a restart never asks Let's Encrypt for a new certificate.
  caddy_data:
  caddy_config:
