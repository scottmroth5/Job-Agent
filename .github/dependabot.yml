# Weekly security and version updates (Mondays, early): npm packages, the GitHub Actions the workflows use, and the
# Docker base image. Patch-level updates merge on their own once CI passes (dependabot-automerge.yml) and ship
# with the weekly rebuild (deploy.yml, Mondays 13:00 UTC); minor and major updates wait for the owner.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      patches:
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
  - package-ecosystem: docker
    directory: /
    # Node stays on its LTS line (22 for now); moving to the next LTS is a decision for the owner, not a weekly update.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
