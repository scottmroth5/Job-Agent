# Tests on every push and pull request. No secrets and no real data: the tests use synthetic fixtures only, and
# the personal-data scan skips itself without the gitignored config (it runs for real in the pre-commit hook).
# The suite runs twice, in a US time zone and in UTC, so a calendar-day bug that only shows on a UTC server fails here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tz: [America/Los_Angeles, UTC]
    env:
      TZ: ${{ matrix.tz }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what the app ships (dev tools excluded); high or critical fails the build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run web:build
      - run: npm run check:personal -- --all
